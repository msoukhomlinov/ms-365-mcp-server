name: Build

on:
  pull_request:
    branches: [ main, integration/hermes-family ]
  # A pull_request run builds refs/pull/N/merge, i.e. the PR merged into the base as
  # it stood when that run started. Two PRs open at once can therefore both be green
  # while the branch they land on is red (this happened with #19 and #20, repaired
  # after the fact by #21). Building integration/hermes-family on push checks the
  # branch content that actually ships. main is deliberately absent: release.yml
  # already runs this same chain on push to main.
  push:
    branches: [ integration/hermes-family ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install patch-package (if needed)
        run: npm i -D patch-package

      - name: Install dependencies
        run: npm ci

      - name: Generate
        run: npm run generate

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build TypeScript
        run: npm run build

      # vitest 4 requires Node >= 20, so tests run on 20+ only
      - name: Run tests
        if: matrix.node-version != '18.x'
        run: npm test

      # On Node 18 we still verify the built artifact starts and loads its modules
      - name: Smoke test (Node 18 runtime check)
        if: matrix.node-version == '18.x'
        run: node dist/index.js --list-presets
