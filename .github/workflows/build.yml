name: Build

on:
  pull_request:
    branches: [ main, integration/hermes-family ]
  # A pull_request run builds refs/pull/N/merge, i.e. the PR merged into the base as
  # it stood when that run started. Two PRs open at once can therefore both be green
  # while the branch they land on is red (this happened with #19 and #20, repaired
  # after the fact by #21). Building integration/hermes-family on push checks the
  # branch content that actually ships. main is deliberately absent: release.yml
  # already runs this same chain on push to main.
  push:
    branches: [ integration/hermes-family ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install patch-package (if needed)
        run: npm i -D patch-package

      - name: Install dependencies
        run: npm ci

      - name: Generate
        run: npm run generate

      - name: Lint code
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # tsup strips types without checking them, so build alone cannot catch type errors
      - name: Type check
        run: npm run typecheck

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test
